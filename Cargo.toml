[package]
name = "ccstatus"
version = "0.2.1"
edition = "2024"
description = "Fast Rust port of daniel3303/ClaudeCodeStatusLine"
repository = "https://github.com/folded/ccstatus-rs"
license = "MIT"
keywords = ["claude", "claude-code", "statusline", "cli"]
categories = ["command-line-utilities"]

[dependencies]
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.11"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
libc = "0.2"
ratatui = "0.30"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
